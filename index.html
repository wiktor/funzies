<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAREK × WARSZAWA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    overflow: hidden;
    height: 100vh;
    font-family: 'Press Start 2P', monospace;
  }

  canvas { position: fixed; top: 0; left: 0; z-index: 0; }

  .overlay {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
  }

  .title {
    font-size: clamp(5rem, 18vw, 14rem);
    color: #ff003c;
    text-shadow:
      0 0 10px #ff003c, 0 0 40px #ff003c, 0 0 80px #ff003c,
      4px 4px 0 #00e5ff, -2px -2px 0 #c800ff;
    animation: glitch 2.5s infinite, pulse 2s ease-in-out infinite;
    letter-spacing: 0.15em;
  }

  .subtitle {
    font-size: clamp(0.7rem, 2.5vw, 1.8rem);
    color: #00e5ff;
    text-shadow: 0 0 10px #00e5ff, 0 0 30px #00e5ff;
    margin-top: 1rem;
    letter-spacing: 0.6em;
    animation: flicker 3.5s infinite;
  }

  .subtitle2 {
    font-size: clamp(0.4rem, 1.2vw, 0.8rem);
    color: #c800ff;
    text-shadow: 0 0 8px #c800ff;
    margin-top: 0.8rem;
    letter-spacing: 0.4em;
    animation: flicker 5s infinite reverse;
    opacity: 0.8;
  }

  .scanlines {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      transparent 0px, transparent 2px,
      rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px
    );
  }

  .vignette {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
  }

  @keyframes glitch {
    0%, 88%, 100% { transform: translate(0); filter: none; }
    89% { transform: translate(-5px, 3px); filter: hue-rotate(90deg); }
    90% { transform: translate(5px, -2px); filter: hue-rotate(-90deg); }
    91% { transform: translate(-3px, -1px) skewX(2deg); }
    92% { transform: translate(3px, 1px) skewX(-1deg); }
    93% { transform: translate(0); filter: none; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.82; }
  }

  @keyframes flicker {
    0%, 93%, 100% { opacity: 1; }
    94% { opacity: 0.2; }
    95% { opacity: 0.9; }
    96% { opacity: 0.3; }
    97% { opacity: 0.7; }
  }

  /* Retro Arcade Navigation */
  .arcade-nav {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(8, 4, 20, 0.9);
    border: 2px solid #00e5ff;
    box-shadow: 0 0 16px rgba(0, 229, 255, 0.45), inset 0 0 10px rgba(0, 229, 255, 0.2);
    padding: 6px 14px;
    border-radius: 4px;
    pointer-events: auto;
  }

  .arcade-nav a {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 1.1vw, 11px);
    color: #8899aa;
    text-decoration: none;
    padding: 6px 10px;
    border: 1px solid transparent;
    transition: all 0.2s;
    letter-spacing: 0.1em;
    display: inline-block;
  }

  .arcade-nav a:hover {
    color: #ffffff;
    border-color: #ff007f;
    text-shadow: 0 0 8px #ff007f;
    background: rgba(255, 0, 127, 0.2);
  }

  .arcade-nav a.active {
    color: #ffe600;
    border-color: #ffe600;
    text-shadow: 0 0 10px #ffe600, 0 0 20px #ff6600;
    background: rgba(255, 230, 0, 0.15);
    box-shadow: 0 0 8px rgba(255, 230, 0, 0.3);
  }

  @media (max-width: 640px) {
    .arcade-nav { gap: 4px; padding: 4px 8px; }
    .arcade-nav a { padding: 4px 6px; font-size: 8px; }
  }
</style>
</head>
<body>
<canvas id="city"></canvas>

<!-- ARCADE NAVIGATION -->
<nav class="arcade-nav">
  <a href="index.html" class="active">★ MAREK</a>
  <a href="antos.html">ANTOS</a>
  <a href="lol.html">LOL</a>
  <a href="bober.html">BOBER</a>
</nav>

<div class="overlay">
  <div class="title">MAREK</div>
  <div class="subtitle">★ WARSZAWA ★</div>
  <div class="subtitle2">CYBERPUNK 20XX</div>
</div>
<div class="scanlines"></div>
<div class="vignette"></div>

<script>
const canvas = document.getElementById('city');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  generateCity();
}

const neonColors = ['#ff003c', '#00e5ff', '#c800ff', '#ff6b00', '#39ff14', '#ffe600'];

class Building {
  constructor(x, w) {
    this.x = x;
    this.w = w;
    this.h = 80 + Math.random() * (H * 0.58);
    this.color = `hsl(${230 + Math.random() * 40}, 35%, ${6 + Math.random() * 10}%)`;
    this.windows = [];
    this.generateWindows();
    this.accent = Math.random() > 0.5 ? neonColors[Math.floor(Math.random() * neonColors.length)] : null;
    this.spire = Math.random() > 0.82;
    this.antenna = !this.spire && Math.random() > 0.85;
    // PKiN-style tower for some tall buildings
    this.isPKiN = this.h > H * 0.45 && Math.random() > 0.7;
  }

  generateWindows() {
    const cols = Math.floor(this.w / 12);
    const rows = Math.floor(this.h / 14);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() > 0.35) {
          this.windows.push({
            x: 4 + c * 12, y: 6 + r * 14,
            lit: Math.random() > 0.25,
            color: Math.random() > 0.75
              ? neonColors[Math.floor(Math.random() * neonColors.length)]
              : (Math.random() > 0.5 ? '#ffcc00' : '#ffeebb')
          });
        }
      }
    }
  }

  draw() {
    const y = H - this.h;

    // Building body
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, y, this.w, this.h);

    // PKiN-style tiered top
    if (this.isPKiN) {
      const tiers = 3;
      for (let i = 0; i < tiers; i++) {
        const tw = this.w * (0.7 - i * 0.2);
        const th = 20 + i * 10;
        ctx.fillRect(this.x + (this.w - tw) / 2, y - (i + 1) * th, tw, th);
      }
      // Antenna
      const antX = this.x + this.w / 2;
      const antTop = y - tiers * 30 - 50;
      ctx.fillStyle = '#444';
      ctx.fillRect(antX - 1, antTop, 2, 50);
      // Red blink
      ctx.fillStyle = t % 2 < 1 ? '#ff003c' : '#660018';
      ctx.shadowColor = '#ff003c';
      ctx.shadowBlur = t % 2 < 1 ? 12 : 4;
      ctx.fillRect(antX - 2, antTop - 2, 4, 4);
      ctx.shadowBlur = 0;
    }

    // Spire (church style — Warsaw has many)
    if (this.spire && !this.isPKiN) {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.moveTo(this.x + this.w / 2 - 5, y);
      ctx.lineTo(this.x + this.w / 2, y - 45);
      ctx.lineTo(this.x + this.w / 2 + 5, y);
      ctx.fill();
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(this.x + this.w / 2 - 1, y - 52, 2, 10);
      ctx.fillRect(this.x + this.w / 2 - 3, y - 48, 6, 2);
    }

    // Antenna
    if (this.antenna && !this.isPKiN) {
      ctx.fillStyle = '#333';
      ctx.fillRect(this.x + this.w / 2 - 1, y - 25, 2, 25);
      ctx.fillStyle = t % 2 < 1 ? '#ff003c' : '#440010';
      ctx.fillRect(this.x + this.w / 2 - 1, y - 27, 3, 3);
    }

    // Neon accents
    if (this.accent) {
      ctx.fillStyle = this.accent;
      ctx.shadowColor = this.accent;
      ctx.shadowBlur = 10;
      ctx.fillRect(this.x, y, this.w, 2);
      // Random neon strip on side
      if (Math.random() > 0.5) {
        const stripY = y + this.h * 0.3;
        ctx.fillRect(this.x, stripY, this.w, 1);
      }
      ctx.shadowBlur = 0;
    }

    // Windows
    for (const win of this.windows) {
      if (win.lit) {
        ctx.fillStyle = win.color;
        ctx.globalAlpha = 0.5 + Math.random() * 0.5;
        ctx.fillRect(this.x + win.x, y + win.y, 6, 7);
        ctx.globalAlpha = 1;
      }
    }
  }
}

let buildings = [];
function generateCity() {
  buildings = [];
  let x = 0;
  while (x < W + 60) {
    const w = 25 + Math.floor(Math.random() * 55);
    buildings.push(new Building(x, w));
    x += w + Math.floor(Math.random() * 6);
  }
}

// Stars
let stars = [];
function generateStars() {
  stars = Array.from({ length: 180 }, () => ({
    x: Math.random() * W, y: Math.random() * H * 0.45,
    s: 1 + Math.random() * 2, b: Math.random()
  }));
}
generateStars();

// Rain
const rain = Array.from({ length: 250 }, () => ({
  x: Math.random() * 2000, y: Math.random() * 1200,
  speed: 5 + Math.random() * 10, len: 10 + Math.random() * 20
}));

// Floating neon signs (Warsaw landmarks)
const signs = ['STARE MIASTO', 'PKIN', 'WISŁA', 'PRAGA', 'NEON MUZEUM', 'ŻUBRÓWKA'];
const floatingSigns = signs.map((text, i) => ({
  text, x: 40 + Math.random() * (Math.min(W, 1200) - 200),
  y: 50 + i * 65 + Math.random() * 20,
  color: neonColors[i % neonColors.length],
  phase: Math.random() * Math.PI * 2
}));

// Tram (Warsaw tram vibes)
let tramX = -200;
const tramSpeed = 1.5;

let t = 0;

function draw() {
  // Sky
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#020014');
  grad.addColorStop(0.3, '#0a0035');
  grad.addColorStop(0.6, '#1a004a');
  grad.addColorStop(0.85, '#120020');
  grad.addColorStop(1, '#0a0a0a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (const star of stars) {
    ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.7 * Math.abs(Math.sin(t * 2 + star.b * 10))})`;
    ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.s, star.s);
  }

  // Moon
  ctx.fillStyle = '#ffe0b0';
  ctx.shadowColor = '#ffe0b0';
  ctx.shadowBlur = 40;
  ctx.beginPath();
  ctx.arc(W * 0.82, H * 0.1, 28, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Distant city glow
  ctx.fillStyle = 'rgba(200, 0, 255, 0.03)';
  ctx.fillRect(0, H * 0.4, W, H * 0.2);

  // Buildings
  for (const b of buildings) b.draw();

  // Ground
  ctx.fillStyle = '#080808';
  ctx.fillRect(0, H - 28, W, 28);

  // Road markings
  ctx.strokeStyle = '#333';
  ctx.setLineDash([20, 30]);
  ctx.beginPath();
  ctx.moveTo(0, H - 14);
  ctx.lineTo(W, H - 14);
  ctx.stroke();
  ctx.setLineDash([]);

  // Neon ground line
  ctx.fillStyle = '#ff003c';
  ctx.shadowColor = '#ff003c';
  ctx.shadowBlur = 12;
  ctx.fillRect(0, H - 28, W, 2);
  ctx.shadowBlur = 0;

  // Second neon line (blue)
  ctx.fillStyle = '#00e5ff';
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 8;
  ctx.fillRect(0, H - 1, W, 1);
  ctx.shadowBlur = 0;

  // Tram (pixel art)
  tramX += tramSpeed;
  if (tramX > W + 200) tramX = -200;
  ctx.fillStyle = '#cc0000';
  ctx.fillRect(tramX, H - 44, 80, 16);
  ctx.fillStyle = '#ffee88';
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(tramX + 8 + i * 15, H - 42, 8, 8);
  }
  ctx.fillStyle = '#666';
  ctx.fillRect(tramX + 5, H - 28, 8, 4);
  ctx.fillRect(tramX + 67, H - 28, 8, 4);
  // Pantograph
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(tramX + 40, H - 44);
  ctx.lineTo(tramX + 40, H - 56);
  ctx.lineTo(tramX + 35, H - 60);
  ctx.moveTo(tramX + 40, H - 56);
  ctx.lineTo(tramX + 45, H - 60);
  ctx.stroke();

  // Overhead wire
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.beginPath();
  ctx.moveTo(0, H - 60);
  ctx.lineTo(W, H - 60);
  ctx.stroke();

  // Floating signs
  for (const sign of floatingSigns) {
    const yOff = Math.sin(t + sign.phase) * 6;
    ctx.font = '9px "Press Start 2P"';
    ctx.fillStyle = sign.color;
    ctx.shadowColor = sign.color;
    ctx.shadowBlur = 14;
    ctx.fillText(sign.text, sign.x, sign.y + yOff);
    ctx.shadowBlur = 0;
  }

  // Rain
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.12)';
  ctx.lineWidth = 1;
  for (const drop of rain) {
    ctx.beginPath();
    ctx.moveTo(drop.x, drop.y);
    ctx.lineTo(drop.x + 1, drop.y + drop.len);
    ctx.stroke();
    drop.y += drop.speed;
    if (drop.y > H) { drop.y = -drop.len; drop.x = Math.random() * W; }
  }

  // Occasional lightning flash
  if (Math.random() > 0.998) {
    ctx.fillStyle = 'rgba(200, 0, 255, 0.06)';
    ctx.fillRect(0, 0, W, H);
  }

  t += 0.01;
  requestAnimationFrame(draw);
}

window.addEventListener('resize', () => { resize(); generateStars(); });
resize();
draw();
</script>
</body>
</html>
